<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do</title>
  </head>
  <body>
    <nav>
      <ul>
        <li>
          <button
            class="new-project-button"
            command="show-modal"
            commandfor="new-project-dialog"
          >
            Add Project
          </button>
        </li>
        <li><a href="#">My Day</a></li>
        <li><a href="#">Next 7 Days</a></li>
        <li><a href="#">My Calender</a></li>
        <li><a href="#">My Projects</a></li>
        <li><a href="#">My Tasks</a></li>
      </ul>
      <div class="projects-nav"></div>
    </nav>
    <div class="content-container">
      <div class="project-container">
        <h1 class="title">Placeholder Title</h1>
        <input type="checkbox" class="project-complete" />
        <div class="description">
          This is some dummy text for the description of a project git
        </div>
        <div class="tasks-container">
          <div class="task-container">
            <details>
              <summary class="task-title">Task Title</summary>
              <input type="checkbox" class="task-complete" />
              <p>This is some dummy text</p>
              <button class="edit-task-button">Edit</button>
              <button class="delete-task">Delete</button>
            </details>
          </div>
          <div class="task-container">
            <div class="task-priority high">
              <input type="checkbox" class="task-complete" />
            </div>
            <div class="task-content-container">
              <details>
                <summary class="task-title">
                  <div class="task-summary-container">
                    <div class="task-title-container">Task Title 2</div>
                  </div>
                </summary>
                <p>This is some dummy text</p>
                <button class="edit-task-button">Edit</button>
                <button class="delete-task">Delete</button>
              </details>
            </div>
          </div>
        </div>
        <div class="project-buttons-container">
          <button class="add-project">Add</button>
          <button class="edit-project">Edit</button>
          <button class="delete-project">Delete</button>
        </div>
      </div>

      <div class="project-container"></div>
      <dialog id="new-project-dialog">
        <form action="#" id="new-project-form">
          <div class="input-container">
            <label for="new-project-name">Name</label>
            <input type="text" id="new-project-name" max="64" required />
          </div>
          <div class="input-container">
            <label for="new-project-date">Due Date</label>
            <input type="date" id="new-project-date" required />
          </div>
          <div class="input-container">
            <label for="new-project-description">Description</label>
            <input type="text" id="new-project-description" required />
          </div>
          <button type="submit" id="project-form-submit">Submit</button>
        </form>
      </dialog>

      <dialog id="edit-project-dialog">
        <form action="#" id="edit-project-form">
          <div class="input-container">
            <label for="edit-project-name">Name</label>
            <input type="text" id="edit-project-name" max="64" required />
          </div>
          <div class="input-container">
            <label for="edit-project-date">Due Date</label>
            <input type="date" id="edit-project-date" required />
          </div>
          <div class="input-container">
            <label for="edit-project-description">Description</label>
            <input type="text" id="edit-project-description" required />
          </div>
          <button type="submit" id="edit-project-form-submit">Submit</button>
        </form>
      </dialog>

      <dialog id="add-task-dialog">
        <form action="#" id="add-task-form">
          <div class="input-container">
            <label for="add-task-name">Name</label>
            <input type="text" id="add-task-name" max="64" required />
          </div>
          <div class="input-container">
            <label for="add-task-date">Due Date</label>
            <input type="date" id="add-task-date" required />
          </div>
          <div class="input-container">
            <label for="add-task-description">Description</label>
            <input type="text" id="add-task-description" required />
          </div>
          <div class="input-container">
            <label for="add-task-priority"></label>
            <select name="add-task-priority" id="add-task-priority" required>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <button type="submit" id="add-task-form-submit">Submit</button>
        </form>
      </dialog>

      <dialog id="edit-task-dialog">
        <form action="#" id="edit-task-form">
          <div class="input-container">
            <label for="edit-task-name">Name</label>
            <input type="text" id="edit-task-name" max="64" required />
          </div>
          <div class="input-container">
            <label for="edit-task-date">Due Date</label>
            <input type="date" id="edit-task-date" required />
          </div>
          <div class="input-container">
            <label for="edit-task-description">Description</label>
            <input type="text" id="edit-task-description" required />
          </div>
          <div class="input-container">
            <label for="edit-task-priority"></label>
            <select name="edit-task-priority" id="edit-task-priority" required>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <button type="submit" id="edit-task-form-submit">Submit</button>
        </form>
      </dialog>
    </div>
  </body>
</html>
